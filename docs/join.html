<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a group — Health Track</title>
  <meta name="description" content="You are invited to a Health Track family group." />
  <meta property="og:title" content="Join my Health Track group" />
  <meta property="og:description" content="Let's get fit together. Open the link to join." />
  <style>
    :root { --blue: #1565c0; --blue-light: #1e88e5; --green: #2e9e3e; --green-light: #43b649; --navy: #12306b; --bg: #f1f8f5; --card: #fff; --text: #0f241b; --muted: #56695f; --border: #d6e6de; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a1511; --card: #13211b; --text: #e7f3ed; --muted: #9bb2a7; --border: #253a31; --navy: #e7f3ed; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; text-align: center; }
    .word { font-size: 38px; font-weight: 800; font-style: italic; margin: 4px 0 18px; }
    .word .h { color: var(--navy); } .word .t { color: var(--green); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 22px; }
    .code { font-size: 44px; font-weight: 800; letter-spacing: 8px; color: var(--green); margin: 6px 0 4px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 16px; font-weight: 800; font-size: 19px; text-decoration: none; color: #fff; margin-top: 14px; }
    .blue { background: linear-gradient(135deg, var(--blue-light), var(--blue)); }
    .green { background: linear-gradient(135deg, var(--green-light), var(--green)); }
    p { color: var(--muted); font-size: 16px; line-height: 1.5; }
    ol { text-align: left; font-size: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg width="96" height="86" viewBox="0 0 100 90" aria-hidden="true">
      <path d="M50 84 C 22 62 6 46 11 26 C 16 9 39 6 50 23" stroke="#1565C0" stroke-width="7" fill="none" stroke-linecap="round" />
      <path d="M50 23 C 61 6 84 9 89 26 C 94 46 78 62 50 84" stroke="#43B649" stroke-width="7" fill="none" stroke-linecap="round" />
      <rect x="27" y="20" width="6" height="20" rx="1.5" fill="#43B649" /><rect x="20" y="27" width="20" height="6" rx="1.5" fill="#43B649" />
      <circle cx="60" cy="34" r="6" fill="#1565C0" />
      <path d="M40 46 Q 50 66 62 62 Q 74 56 80 30" stroke="#2E9E3E" stroke-width="7" fill="none" stroke-linecap="round" />
    </svg>
    <div class="word"><span class="h">Health</span> <span class="t">Track</span></div>

    <div class="card">
      <h2 style="margin:0">👋 You're invited to a family group!</h2>
      <p>Your group join code:</p>
      <div class="code" id="code">— — —</div>
      <a class="btn blue" id="open" href="#">📱 Open in Health Track</a>
      <a class="btn green" href="./#download">⬇️ Get the app</a>
      <ol>
        <li>Install the <b>Health Track</b> app.</li>
        <li>Log in (with the mobile number your family added, or tap <b>Start</b>).</li>
        <li>Group tab → <b>Join Invited Group</b> → enter the code above.</li>
      </ol>
    </div>
  </div>
  <script>
    var code = (new URLSearchParams(location.search).get('code') || '').replace(/\D/g, '').slice(0, 6);
    if (code.length === 6) {
      document.getElementById('code').textContent = code;
      document.getElementById('open').href = 'healthtracker://join?code=' + code;
    } else {
      document.getElementById('code').textContent = 'Ask your family for the code';
      document.getElementById('code').style.fontSize = '20px';
      document.getElementById('code').style.letterSpacing = '0';
      document.getElementById('open').style.display = 'none';
    }
  </script>
</body>
</html>
